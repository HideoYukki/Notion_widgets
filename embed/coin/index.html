<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Coin flip</title>
<style>
  :root{--card:#ffffff;--text:#1c2430;--accent:#3b6fd4}
  @media (prefers-color-scheme:dark){
    :root{--card:#232a36;--text:#eef2f8;--accent:#7aa7ff}
  }
  :root{
    --muted:color-mix(in srgb,var(--text) 62%,transparent);
    --line:color-mix(in srgb,var(--text) 14%,transparent);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;padding:2px;background:transparent;color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

  .card{container-type:size;width:100%;height:100%;border-radius:16px;background:var(--card);
    box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;cursor:pointer;outline:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(6px,3cqh,16px);padding:clamp(8px,4cqmin,22px)}
  .card:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}

  .stage{flex:none;width:var(--d,120px);height:var(--d,120px);perspective:900px}
  .jump{width:100%;height:100%}
  .jump.go{animation:hop 1.1s ease-out}
  @keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(calc(var(--d) * -.3))}}
  .coin{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
  .face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:14%;
    background:radial-gradient(circle at 35% 30%,#fff3b0,#f5c542 45%,#c9961a 100%);
    box-shadow:inset 0 0 0 calc(var(--d) * .035) #e0a82a,inset 0 0 0 calc(var(--d) * .06) rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.25);
    color:#7a5200;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
  .back{transform:rotateX(180deg)}

  .tally{font-size:clamp(11px,min(3.2cqw,6cqh),16px);color:var(--muted);text-align:center;
    font-variant-numeric:tabular-nums;min-height:1.3em}
  .tally b{color:var(--text)}
  @media (prefers-reduced-motion:reduce){.coin{transition:none}.jump.go{animation:none}}
</style>
</head>
<body>
<div class="card" id="card" tabindex="0" role="button">
  <div class="stage" id="stage"><div class="jump" id="jump"><div class="coin" id="coin">
    <div class="face" id="fa"></div><div class="face back" id="fb"></div>
  </div></div></div>
  <div class="tally" id="tally"></div>
</div>

<script>
/* ---------- colors from the URL: ?color=4E2B3C&text=FBF3F7&accent=F2B8CF ---------- */
const Q = new URLSearchParams(location.search);
const hex = v => { v=(v||'').replace(/^#/,'').trim(); if(/^[0-9a-f]{3}$/i.test(v)) v=v.replace(/./g,'$&$&'); return /^[0-9a-f]{6}$/i.test(v)?'#'+v:null; };
(function(){
  const bg=hex(Q.get('color')), tx=hex(Q.get('text')), ac=hex(Q.get('accent')), s=document.documentElement.style;
  if(bg){
    const n=parseInt(bg.slice(1),16), lum=(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255;
    s.setProperty('--card',bg);
    s.setProperty('--text',lum<.55?'#f6eef2':'#1c2430');
    s.setProperty('--accent','color-mix(in srgb, var(--text) 78%, var(--card))');
  }
  if(tx) s.setProperty('--text',tx);
  if(ac) s.setProperty('--accent',ac);
})();

/* ---------- language ---------- */
let LOC = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
try{ new Intl.DateTimeFormat(LOC); }catch(e){ LOC = 'en'; }
const LANG = LOC.split('-')[0].toLowerCase();
const T = {
  en:{a:'Heads',b:'Tails',tap:'Tap to flip'},
  pl:{a:'Orzeł',b:'Reszka',tap:'Kliknij, aby rzucić'},
  de:{a:'Kopf',b:'Zahl',tap:'Zum Werfen tippen'},
  es:{a:'Cara',b:'Cruz',tap:'Toca para lanzar'},
  fr:{a:'Face',b:'Pile',tap:'Touchez pour lancer'}
};
const TX = T[LANG] || T.en;

/* ---------- labels: ?a=Heads&b=Tails ---------- */
const LABELS = [(Q.get('a') || TX.a).slice(0, 24), (Q.get('b') || TX.b).slice(0, 24)];
const $ = id => document.getElementById(id);
[$('fa'), $('fb')].forEach((f, i) => {
  f.textContent = LABELS[i];
  const n = LABELS[i].length;
  f.style.fontSize = `calc(var(--d) * ${n <= 4 ? .22 : n <= 8 ? .15 : n <= 14 ? .1 : .075})`;
});

/* unbiased random integer in [0, n) */
const rnd = n => { const a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n;
  do crypto.getRandomValues(a); while(a[0] >= lim); return a[0] % n; };

/* ---------- sizing ---------- */
const card = $('card');
function size(){
  const w = card.clientWidth, h = card.clientHeight;
  if(!w || !h) return;
  const d = Math.max(56, Math.min(w * .8, (h - 40) * .78));
  document.documentElement.style.setProperty('--d', d + 'px');
}
new ResizeObserver(size).observe(card);
size();

/* ---------- flipping ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const counts = [0, 0];
let rot = 0, busy = false;
const tally = $('tally');
const showTally = () => {
  tally.innerHTML = (counts[0] + counts[1])
    ? `${LABELS[0]}: <b>${counts[0]}</b> · ${LABELS[1]}: <b>${counts[1]}</b>`
    : TX.tap;
};
showTally();

function flip(){
  if(busy) return;
  busy = true;
  const res = rnd(2);                                   // 0 = front, 1 = back
  const cur = ((rot % 360) + 360) % 360;
  const want = res ? 180 : 0;
  rot += (want - cur + 360) % 360 + 360 * (4 + rnd(3));  // whole spins, then land on the chosen side
  tally.textContent = '…';
  $('coin').style.transform = `rotateX(${rot}deg)`;
  const j = $('jump');
  j.classList.remove('go'); void j.offsetWidth; j.classList.add('go');
  setTimeout(() => { counts[res]++; showTally(); busy = false; }, reduce ? 0 : 1150);
}
card.addEventListener('click', flip);
card.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flip(); } });
</script>
</body>
</html>
